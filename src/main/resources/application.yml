spring:
  application:
    name: personpecipebackend
  datasource:
    url: jdbc:mysql://localhost:3306/person_recipe?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.personrecipe.entity
  configuration:
    # 数据库 snake_case 字段自动映射到实体 camelCase 属性
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8080

# 本地图片上传
file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}
  access-path: /uploads

# 微信小程序配置（请替换为你的真实 appId / secret）
wechat:
  app-id: ${WECHAT_APP_ID:your-app-id}
  app-secret: ${WECHAT_APP_SECRET:your-app-secret}
  # 本地联调可开 mock：不调微信接口，用 code 当作 openid
  mock-enabled: ${WECHAT_MOCK_ENABLED:false}

# JWT：7 天过期
jwt:
  secret: ${JWT_SECRET:person-recipe-jwt-secret-change-me-please-32bytes!!}
  expire-days: 7
